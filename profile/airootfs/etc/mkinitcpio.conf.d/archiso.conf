# The archiso_pxe_* hooks from the releng profile are dropped: this profile
# builds no netboot artifacts, so nothing can ever boot over the network.
# 'microcode' embeds amd-ucode/intel-ucode into the initramfs, which is what
# keeps a UKI viable - there is no separate ucode image to load.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)

# zstd, not releng's xz -9e. The initramfs ends up inside a PE section of the
# UKI, which nothing recompresses, and rebuild time dominates during profile
# iteration. Costs roughly 15 MiB of ISO for a much faster build.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
