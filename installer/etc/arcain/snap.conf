# arcain-snap configuration.
#
# Sourced as bash, so it can use arrays. Every setting here overrides a default
# in /usr/local/bin/arcain-snap.

# config name -> the subvolume it snapshots. A config exists for something you
# would want to roll back independently, which is why /var/log, /var/cache and
# the bulk data subvolumes are absent: they are excluded from rollback on
# purpose, so snapshotting them would only cost space.
declare -A CONFIGS=(
    [root]='/'
    [home]='/home'
)

# Snapshots live in their own subvolume so they are never inside anything they
# snapshot. Nesting would make each snapshot contain all the older ones.
SNAPSHOT_DIR='/.snapshots'

# btrfs send target. Expected to be absent most of the time — sdc is meant to
# be unpluggable, and a missing target is a skip, not a failure.
BACKUP_TARGET='/mnt/backup'

# Retention. Counts, not sizes: no qgroups anywhere in this design.
#   KEEP_PREPOST  pacman pre/post snapshots, newest first (20 = 10 upgrades)
#   KEEP_HOURLY   consecutive timeline snapshots kept outright
#   KEEP_DAILY    additional distinct days beyond the hourly window
#   KEEP_WEEKLY   additional distinct ISO weeks beyond the daily window
# At the default hourly timer that is 24h + 7d + 4w ≈ a month of history in
# 35 snapshots per config.
KEEP_PREPOST=20
KEEP_HOURLY=24
KEEP_DAILY=7
KEEP_WEEKLY=4
